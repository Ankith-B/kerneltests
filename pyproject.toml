[project]
name = "kerneltests"
version = "0.0.1"
description = "Modern kernel-based hypothesis tests for two-sample testing, goodness-of-fit, and independence"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]
license = {text = "MIT"}
authors = [{name = "Ankith Burki"}]
readme = "README.md"

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
jax = ["jax>=0.4"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["kt", "kt.backends"]


[tool.pytest.ini_options]
testpaths = ["tests"]
